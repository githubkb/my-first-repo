    <style>
        /* ফন্ট এবং ব্যাকগ্রাউন্ড */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f7f6; margin: 0; padding: 20px; }
        
        /* কার্ডের ডিজাইন */
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); text-align: center; 
                /* এই অংশটি কার্ডটিকে চওড়া করবে */
                width: 100%; max-width: 600px; 
                transition: transform 0.3s ease; }
        .card:hover { transform: translateY(-5px); }

        /* নাম */
        h1 { color: #2c3e50; font-size: 28px; margin-bottom: 5px; }
        
        /* পদবী এবং কোম্পানি (কোম্পানি নাম এক লাইনে থাকবে) */
        .title { color: #16a085; font-weight: 600; font-size: 18px; margin-top: 0; margin-bottom: 5px; white-space: nowrap; }
        .expertise { color: #7f8c8d; font-size: 16px; margin-top: 0; margin-bottom: 25px; }

        /* কন্টাক্ট ইনফো */
        .contact-info { margin-bottom: 30px; border-top: 1px solid #eee; padding-top: 20px; text-align: left; display: inline-block; }
        .contact-item { display: flex; align-items: center; margin-bottom: 10px; color: #34495e; font-size: 16px; }
        .contact-item strong { color: #2c3e50; margin-right: 10px; min-width: 60px; }
        .contact-item a { color: #3498db; text-decoration: none; }
        .contact-item a:hover { text-decoration: underline; }

        /* বাটন */
        .btn { background: #27ae60; color: white; padding: 12px 24px; text-decoration: none; border-radius: 30px; display: inline-block; font-weight: bold; font-size: 16px; transition: background 0.3s ease; }
        .btn:hover { background: #219150; }
    </style>
</head>
<body>
    <div class="card">
